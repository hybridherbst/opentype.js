<!DOCTYPE html>
<html lang="en">
<meta charset="UTF-8">
<title>OpenType reading & writing (with variable fonts)</title>
<style>
    body {
        font: 13px Helvetica, arial, freesans, sans-serif;
        line-height: 1.4;
        color: #333;
        margin: 0 0 50px 0;
        padding: 0;
    }
    .container {
        width: 940px;
        margin-left: auto;
        margin-right: auto;
    }
    header {
        border-bottom: 1px solid #ddd;
        padding: 10px 0;
        margin-bottom: 10px;
    }
    header .actions {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
    }
    #glyphs {
        clear: both;
    }
    .wrapper {
        float: left;
        margin: 5px;
        border: 1px solid #ccc;
    }
    .wrapper span {
        text-align: center;
        background: #ddd;
        display: block;
    }
    a:not([href]) {
        display: none;
    }
    #var-ui {
        border: 1px solid #ddd;
        padding: 10px;
        margin: 10px 0;
        border-radius: 6px;
        background: #fafafa;
    }
    #var-ui h3 { margin: 0 0 6px; }
    #axes { display: grid; grid-template-columns: 1fr 4fr 90px; gap: 6px 10px; align-items: center; }
    #axes .axis-tag { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    #axes input[type="range"] { width: 100%; }
    #axes input[type="number"] { width: 90px; }
    #instances { margin-top: 8px; }
    #details { margin-top: 10px; font-size: 12px; color: #555; }
    #preview { border: 1px dashed #ccc; padding: 8px; margin: 10px 0; }
    #preview-text { width: 100%; font-size: 18px; padding: 6px; }
    #snap-ui { border: 1px solid #ddd; padding: 10px; margin: 10px 0; border-radius: 6px; background: #fafafa; }
    #snap-ui h3 { margin: 0 0 6px; }
    #snap-controls { display: grid; grid-template-columns: 160px 1fr 70px; gap: 6px 10px; align-items: center; }
    #snap-controls input[type="range"] { width: 100%; }
    #snap-series { margin-top: 8px; display: grid; grid-template-columns: repeat(6, minmax(0,1fr)); gap: 8px; align-items: end; }
    #snap-results a { display: inline-block; margin-right: 8px; }
    .row-flex { margin-top:8px; display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
    .mt-8 { margin-top:8px; }
    .mt-6 { margin-top:6px; }
    .note { font-size:12px; color:#666; }
</style>

<div class="container" name="demo">
    <header>
        <h1><output name="fontFamilyName"></output></h1>
        <div class="actions">
            <label for="file-input">Open font file</label>
            <input type="file" id="file-input" accept=".ttf,.otf,.woff,.woff2,.otc,.ttc" title="Open a font file (.ttf, .otf, .woff, .woff2)" />
            <a id="download-variable" download>Download variable (round-trip)</a>
            <a id="download-static" download>Download static instance</a>
        </div>
    </header>

    <div id="var-ui" hidden>
        <h3>Variable font</h3>
        <div id="instances">
            <label for="instance-select">Instance:</label>
            <select id="instance-select"></select>
        </div>
        <div id="axes"></div>
        <div id="details"></div>
    </div>

    <div id="preview">
        <label for="preview-text">Preview text</label>
        <input id="preview-text" type="text" value="Hamburgefonstiv 0123456789" />
        <div id="preview-canvas-wrap"></div>
    </div>

    <div id="snap-ui">
        <h3>Snapping</h3>
        <div id="snap-controls">
            <label for="snap-strength">Strength</label>
            <input id="snap-strength" type="range" min="0" max="100" value="80" />
            <output id="snap-strength-out">80</output>

            <label for="snap-distance">Distance</label>
            <input id="snap-distance" type="range" min="1" max="100" value="50" />
            <output id="snap-distance-out">50</output>

            <label for="snap-x">X offset</label>
            <input id="snap-x" type="range" min="-100" max="100" value="0" />
            <output id="snap-x-out">0</output>

            <label for="snap-y">Y offset</label>
            <input id="snap-y" type="range" min="-100" max="100" value="0" />
            <output id="snap-y-out">0</output>
        </div>
    <div class="row-flex">
            <button id="download-baked-snapped" type="button">Download baked (snapped)</button>
        </div>
        <div id="snap-series">
            <label for="snap-start">Start strength</label>
            <input id="snap-start" type="number" min="0" max="100" value="20" />
            <label for="snap-end">End strength</label>
            <input id="snap-end" type="number" min="0" max="100" value="80" />
            <label for="snap-steps">Steps</label>
            <input id="snap-steps" type="number" min="2" max="20" value="5" />
            <button id="gen-snap-series" type="button">Generate snapped series</button>
        </div>
    <div id="snap-results" class="mt-8"></div>
    <div class="mt-6 note">Note: Creating a new SNAP axis with live deltas isn’t currently supported by the writer; use the series to test different snapping levels.</div>
    </div>

    <div id="glyphs"></div>
</div>

<script type="module">
import * as opentype from "/dist/opentype.module.js";

// Create a canvas and adds it to the document.
// Returns the 2d drawing context.
function createGlyphCanvas(glyph, size) {
    const canvasId = 'c' + glyph.index;
    const html = '<div class="wrapper" style="width:' + size + 'px"><canvas id="' + canvasId + '" width="' + size + '" height="' + size + '"></canvas><span>' + glyph.index + '</span><span>' + glyph.name + '</span><span>U ' + glyph.unicode + '</span></div>';
    const glyphsDiv = document.getElementById('glyphs');
    const wrap = document.createElement('div');
    wrap.innerHTML = html;
    glyphsDiv.appendChild(wrap);
    const canvas = document.getElementById(canvasId);
    return canvas.getContext('2d');
}

const form = document.querySelector('[name="demo"]');
const fileInput = document.getElementById('file-input');
const downloadVar = document.getElementById('download-variable');
const downloadStatic = document.getElementById('download-static');
const axesWrap = document.getElementById('axes');
const details = document.getElementById('details');
const instances = document.getElementById('instance-select');
const varUi = document.getElementById('var-ui');
const previewText = document.getElementById('preview-text');
const previewWrap = document.getElementById('preview-canvas-wrap');
// Snapping controls
const snapStrengthEl = document.getElementById('snap-strength');
const snapStrengthOut = document.getElementById('snap-strength-out');
const snapDistanceEl = document.getElementById('snap-distance');
const snapDistanceOut = document.getElementById('snap-distance-out');
const snapXEl = document.getElementById('snap-x');
const snapXOut = document.getElementById('snap-x-out');
const snapYEl = document.getElementById('snap-y');
const snapYOut = document.getElementById('snap-y-out');
const snapStartEl = document.getElementById('snap-start');
const snapEndEl = document.getElementById('snap-end');
const snapStepsEl = document.getElementById('snap-steps');
const bakedSnappedBtn = document.getElementById('download-baked-snapped');
const genSnapSeriesBtn = document.getElementById('gen-snap-series');
const snapResults = document.getElementById('snap-results');

let currentFont = null;

async function loadDefaultFont() {
    // Fallback non-variable demo if user doesn't upload a font
    const buf = await fetch('../fonts/FiraSansMedium.woff');
    const font = opentype.parse(await buf.arrayBuffer());
    applyLoadedFont(font, 'FiraSansMedium.woff');
}

function setDownloadLinks(font, basename = 'font') {
    const ext = font.outlinesFormat === 'cff' ? 'otf' : 'ttf';
    const base = basename.replace(/(\.otf|\.ttf|\.woff2?|\.otc|\.ttc)$/i,'');

    // Variable (round-trip): reserialize the font as-is
    const varBlob = new Blob([font.toArrayBuffer()], { type: `font/${ext}` });
    downloadVar.href = URL.createObjectURL(varBlob);
    downloadVar.download = `${base}.${ext}`;

    // Static instance baked with current coords (or as-is if non-variable)
    let staticFont;
    try {
        const coords = font.variation && font.variation.get && font.variation.get();
        staticFont = font.instantiate ? font.instantiate(coords) : font;
    } catch (e) {
        staticFont = font;
    }
    const staticBlob = new Blob([staticFont.toArrayBuffer()], { type: `font/${ext}` });
    downloadStatic.href = URL.createObjectURL(staticBlob);
    downloadStatic.download = `${base}-static.${ext}`;
}

function renderPreview(font) {
    // Single-line canvas text preview rendered via glyph paths
    previewWrap.innerHTML = '';
    const canvas = document.createElement('canvas');
    canvas.width = 900; canvas.height = 120;
    previewWrap.appendChild(canvas);
    const ctx = canvas.getContext('2d');
    const text = previewText.value || '';
    const fontSize = 72;
    let x = 20, y = 96;
    const snapParams = getSnapParams();
    for (const ch of text) {
        const g = font.charToGlyph(ch);
        const p = g.getPath(x, y, fontSize, {}, font);
        for (const cmd of p.commands) snapCommand(cmd, snapParams);
        p.draw(ctx);
        x += g.advanceWidth * (fontSize / font.unitsPerEm);
    }
}

function renderGlyphGrid(font) {
    const glyphsDiv = document.getElementById('glyphs');
    glyphsDiv.innerHTML = '';
    const maxShow = Math.min(font.glyphs.length, 120);
    for (let i = 0; i < maxShow; i++) {
        const glyph = font.glyphs.get(i);
        const ctx = createGlyphCanvas(glyph, 150);
        const x = 50;
        const y = 120;
        const fontSize = 72;
        glyph.draw(ctx, x, y, fontSize, {}, font);
        glyph.drawPoints(ctx, x, y, fontSize);
        glyph.drawMetrics(ctx, x, y, fontSize);
    }
}

function getSnapParams() {
    const strength = Number(snapStrengthEl.value) / 100;
    const distance = Number(snapDistanceEl.value);
    const x = Number(snapXEl.value);
    const y = Number(snapYEl.value);
    return { strength, distance, x, y };
}

function snapValue(v, dist, s) {
    return (v * (1.0 - s)) + (s * Math.round(v / dist) * dist);
}

function snapCommand(cmd, p) {
    const apply = (val, offset) => snapValue(val + offset, p.distance, p.strength) - offset;
    if (cmd.x !== undefined) cmd.x = apply(cmd.x, p.x);
    if (cmd.y !== undefined) cmd.y = apply(cmd.y, p.y);
    if (cmd.x1 !== undefined) cmd.x1 = apply(cmd.x1, p.x);
    if (cmd.y1 !== undefined) cmd.y1 = apply(cmd.y1, p.y);
    if (cmd.x2 !== undefined) cmd.x2 = apply(cmd.x2, p.x);
    if (cmd.y2 !== undefined) cmd.y2 = apply(cmd.y2, p.y);
}

function applySnappingToFontInPlace(font, params) {
    for (let i = 0; i < font.glyphs.length; i++) {
        const g = font.glyphs.get(i);
        if (!g || !g.path || !g.path.commands) continue;
        for (const cmd of g.path.commands) snapCommand(cmd, params);
    }
}

function cloneFontDeep(font) {
    return opentype.parse(font.toArrayBuffer());
}

function buildInstancesUI(font) {
    instances.innerHTML = '';
    const fvar = font.tables && font.tables.fvar;
    if (!fvar || !fvar.instances || !fvar.instances.length) {
        const opt = document.createElement('option');
        opt.textContent = '— No named instances —';
        opt.value = '';
        instances.appendChild(opt);
        instances.disabled = true;
        return;
    }
    instances.disabled = false;
    fvar.instances.forEach((inst, i) => {
        const opt = document.createElement('option');
        const name = (inst.name && (inst.name.en || Object.values(inst.name)[0])) || `Instance ${i+1}`;
        opt.value = String(i);
        opt.textContent = `${name}`;
        instances.appendChild(opt);
    });
}

function buildAxesUI(font) {
    axesWrap.innerHTML = '';
    const fvar = font.tables && font.tables.fvar;
    if (!fvar || !fvar.axes || !fvar.axes.length) return;
    const current = font.variation.get();
    fvar.axes.forEach(axis => {
        const tagLabel = document.createElement('div');
        tagLabel.className = 'axis-tag';
        const axisName = (axis.name && (axis.name.en || Object.values(axis.name)[0])) || axis.tag;
        tagLabel.textContent = `${axis.tag} — ${axisName}`;

        const range = document.createElement('input');
        range.type = 'range';
        range.min = axis.minValue;
        range.max = axis.maxValue;
        const step = (axis.maxValue - axis.minValue) > 10 ? 1 : 0.01;
        range.step = String(step);
        range.value = current[axis.tag] ?? axis.defaultValue;

        const num = document.createElement('input');
        num.type = 'number';
        num.min = axis.minValue; num.max = axis.maxValue; num.step = range.step; 
        num.value = range.value;

        function apply(val) {
            const v = Math.max(axis.minValue, Math.min(axis.maxValue, Number(val)));
            const coords = { [axis.tag]: v };
            font.variation.set(coords);
            range.value = v; num.value = v;
            setDownloadLinks(font, guessFileName(font));
            renderPreview(font);
            renderGlyphGrid(font);
        }
        range.addEventListener('input', e => apply(e.target.value));
        num.addEventListener('change', e => apply(e.target.value));

        axesWrap.appendChild(tagLabel);
        axesWrap.appendChild(range);
        axesWrap.appendChild(num);
    });
}

function fillDetails(font) {
    const parts = [];
    const fvar = font.tables && font.tables.fvar;
    const flags = [
        ['fvar', !!fvar],
        ['gvar', !!(font.tables && font.tables.gvar)],
        ['hvar', !!(font.tables && font.tables.hvar)],
        ['cvar', !!(font.tables && font.tables.cvar)],
        ['avar', !!(font.tables && font.tables.avar)],
        ['CFF2', !!(font.tables && font.tables.cff2)],
    ].map(([k,v]) => v ? k : null).filter(Boolean).join(', ');
    const family = font.getEnglishName ? (font.getEnglishName('fontFamily') || '') : '';
    const subfamily = font.getEnglishName ? (font.getEnglishName('fontSubfamily') || '') : '';
    parts.push(`Family: ${family} ${subfamily}`);
    parts.push(`Outlines: ${font.outlinesFormat}`);
    parts.push(`Tables: ${flags || '—'}`);
    if (fvar && fvar.axes && fvar.axes.length) {
        parts.push(`Axes: ${fvar.axes.map(a => `${a.tag} [${a.minValue}–${a.maxValue}] d=${a.defaultValue}`).join('; ')}`);
        if (fvar.instances && fvar.instances.length) {
            parts.push(`Instances: ${fvar.instances.length}`);
        }
    }
    details.textContent = parts.join(' | ');
}

function guessFileName(font) {
    const family = font.getEnglishName && font.getEnglishName('fontFamily');
    const subfamily = font.getEnglishName && font.getEnglishName('fontSubfamily');
    return [family, subfamily].filter(Boolean).join('-') + (font.outlinesFormat === 'cff' ? '.otf' : '.ttf');
}

function applyLoadedFont(font, filename) {
    currentFont = font;
    try { document.querySelector('output[name="fontFamilyName"]').innerText = guessFileName(font) || filename || 'Font'; } catch(e) {}
    setDownloadLinks(font, filename || guessFileName(font));
    // Variable UI
    const isVar = !!(font.tables && font.tables.fvar);
    varUi.hidden = !isVar;
    if (isVar) {
        buildInstancesUI(font);
        buildAxesUI(font);
        fillDetails(font);
    } else {
        details.textContent = 'Non-variable font';
    }
    renderPreview(font);
    renderGlyphGrid(font);
}

fileInput.addEventListener('change', async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const buf = await file.arrayBuffer();
    const font = opentype.parse(buf);
    applyLoadedFont(font, file.name);
});

instances.addEventListener('change', (e) => {
    if (!currentFont || !currentFont.variation) return;
    const idx = Number(e.target.value);
    if (Number.isInteger(idx)) {
        currentFont.variation.set(idx);
        setDownloadLinks(currentFont, guessFileName(currentFont));
        renderPreview(currentFont);
        renderGlyphGrid(currentFont);
    }
});

previewText.addEventListener('input', () => currentFont && renderPreview(currentFont));

// Snap controls wiring
for (const [input, out] of [[snapStrengthEl, snapStrengthOut],[snapDistanceEl, snapDistanceOut],[snapXEl, snapXOut],[snapYEl, snapYOut]]) {
    input.addEventListener('input', (e) => { out.textContent = e.target.value; renderPreview(currentFont); });
}

bakedSnappedBtn.addEventListener('click', () => {
    if (!currentFont) return;
    const params = getSnapParams();
    const baked = currentFont.instantiate ? currentFont.instantiate(currentFont.variation && currentFont.variation.get && currentFont.variation.get()) : cloneFontDeep(currentFont);
    applySnappingToFontInPlace(baked, params);
    const ext = baked.outlinesFormat === 'cff' ? 'otf' : 'ttf';
    const blob = new Blob([baked.toArrayBuffer()], { type: `font/${ext}` });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${(guessFileName(baked) || 'font').replace(/\.(otf|ttf)$/i,'')}-snapped.${ext}`;
    a.click();
});

genSnapSeriesBtn.addEventListener('click', () => {
    if (!currentFont) return;
    snapResults.innerHTML = '';
    const start = Number(snapStartEl.value);
    const end = Number(snapEndEl.value);
    const steps = Math.max(2, Number(snapStepsEl.value)|0);
    for (let i = 0; i < steps; i++) {
        const t = steps === 1 ? 0 : i / (steps - 1);
        const strengthPct = Math.round(start + (end - start) * t);
        const params = { ...getSnapParams(), strength: strengthPct / 100 };
        const variant = cloneFontDeep(currentFont); // keep variation data intact
        applySnappingToFontInPlace(variant, params);
        const ext = variant.outlinesFormat === 'cff' ? 'otf' : 'ttf';
        const blob = new Blob([variant.toArrayBuffer()], { type: `font/${ext}` });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `${(guessFileName(variant) || 'font').replace(/\.(otf|ttf)$/i,'')}-snap${strengthPct}.${ext}`;
        a.textContent = `Download ${strengthPct}%`;
        snapResults.appendChild(a);
    }
});

// Load a default font so the page has content; users can upload a variable font to explore.
await loadDefaultFont();
</script>
</body>
</html>
